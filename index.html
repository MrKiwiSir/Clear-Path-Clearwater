<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b2a33">
<title>Clear Path · Clearwater</title>

<style>
:root{--A:#c62828;--B:#ef7d22;--C:#d4b106;--N:#2e7d4f;--ink:#1b2a33;--bg:#fff;--mute:#5f6b72;--line:#e3e6e8}
*{box-sizing:border-box}html,body{margin:0;height:100%;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
#map{position:absolute;inset:0 0 0 0}
#top{position:absolute;z-index:1000;top:calc(env(safe-area-inset-top) + 8px);left:8px;right:8px;display:flex;gap:6px;align-items:center;pointer-events:none}
#top>*{pointer-events:auto}
.brand{background:var(--ink);color:#fff;border-radius:10px;padding:7px 11px;font-weight:700;font-size:14px;box-shadow:0 2px 8px #0003}
.btn{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 11px;font:inherit;font-size:14px;box-shadow:0 2px 8px #0002;cursor:pointer;color:var(--ink)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn:disabled{opacity:.5}
#status{position:absolute;z-index:1000;top:calc(env(safe-area-inset-top) + 52px);left:8px;background:#fffd;border-radius:8px;padding:4px 9px;font-size:12px;color:var(--mute);box-shadow:0 1px 4px #0002}
#sheet{position:absolute;z-index:1000;left:0;right:0;bottom:0;background:var(--bg);border-radius:16px 16px 0 0;box-shadow:0 -4px 18px #0003;max-height:46vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;background:none;border:0;padding:11px 4px;font:inherit;font-weight:600;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer}
#tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
#pane{overflow:auto;padding:10px 14px 14px}
.row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.dot{width:12px;height:12px;border-radius:50%;flex:none;margin-top:4px}
.small{font-size:12.5px;color:var(--mute)}
.tag{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:9px;padding:1px 7px;margin-right:4px}
select,input{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.leaflet-popup-content{margin:10px 12px;font-size:13.5px;line-height:1.4}
.leaflet-popup-content b{font-size:14px}
.pbtns{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.pbtns button{font:inherit;font-size:12.5px;padding:4px 8px;border-radius:7px;border:1px solid var(--line);background:#f6f7f8;cursor:pointer}
.legend span{display:inline-flex;align-items:center;gap:5px;margin:0 10px 6px 0;font-size:13px}
.warn{background:#fff7e0;border:1px solid #f1d58a;border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0}
a{color:#1565c0}
</style>
</head>
<body>
<div id="map"></div>
<div id="top">
  <span class="brand">Clear Path</span>
  <button class="btn" id="locBtn" title="Show my location">📍 Me</button>
  <button class="btn" id="scanBtn" title="Load businesses in the visible area">Scan area</button>
  <button class="btn" id="tipBtn" title="Show or hide public comments">💬 On</button>
</div>
<div id="status">Loading…</div>
<div id="sheet">
  <div id="tabs">
    <button data-t="near" class="on">Clean picks</button>
    <button data-t="route">Route</button>
    <button data-t="info">Key & data</button>
  </div>
  <div id="pane"></div>
</div>

function classify(owner,addr,homestead){

  for(const g of GROUPS){
    if(g.like && owner.includes(g.like)) return {g,how:'owner'};
    if(g.owners && g.owners.includes(owner)) return {g,how:'owner'};
  }
  if(homestead==='Yes' || !ENTITY.test(owner) || /, /.test(owner)) return null; // never flag homes or named individuals by address alone

    if(g.addrs && g.addrs.includes(addr)) return {g:{...g,tier:'C',name:'Possible new member of '+g.name,ev:'Not on the reviewed list, but uses the same owner mailing address as '+g.name+' ('+addr+'). Could be a new purchase — verify on Sunbiz.'},how:'address'};

  let feats=[],off=0;
  for(let i=0;i<10;i++){
    const body=new URLSearchParams({where,geometry:`${BBOX.w},${BBOX.s},${BBOX.e},${BBOX.n}`,geometryType:'esriGeometryEnvelope',inSR:'4326',spatialRel:'esriSpatialRelIntersects',outFields:out,returnGeometry:'true',outSR:'4326',geometryPrecision:'6',resultOffset:off,resultRecordCount:1000,f:'json'});
    const r=await fetch(PARCEL_URL,{method:'POST',body});
    const j=await r.json(); if(j.error) throw new Error(j.error.message);
    feats=feats.concat(j.features||[]); if(!j.exceededTransferLimit && (j.features||[]).length<1000) break; off+=1000;
  }
  PARCELS=[];
  for(const f of feats){
    const a={};for(const k in f.attributes)a[k.split('.').pop()]=f.attributes[k];
    const c=classify(a.OWNER1,a.OWNADD_1,a.HOMESTEAD); if(!c) continue;
    const rings=(f.geometry?.rings||[]).map(r=>r.map(([x,y])=>[y,x]));
    PARCELS.push({...a,tier:c.g.tier,group:c.g,how:c.how,rings});
  }
  drawParcels(); return PARCELS.length;
}
function drawParcels(){
  parcelLayer.clearLayers();
  for(const p of PARCELS){
    p.bounds=L.polygon(p.rings).getBounds();
    if(p.tier==='C'&&!SHOWC)continue;
    const poly=L.polygon(p.rings,{color:TIERC[p.tier],weight:1,fillOpacity:.38});
    poly.bindPopup(()=>parcelPopup(p)); poly.addTo(parcelLayer); p.poly=poly; p.bounds=poly.getBounds();
  }
}
function srcLinks(g){return (g.src||[]).map(k=>`<a href="${SRC[k][1]}" target="_blank" rel="noopener">${SRC[k][0]}</a>`).join(' · ')}
function parcelPopup(p){
  return `<span class="tag" style="background:${TIERC[p.tier]}">${p.tier}</span><b>${esc(p.OWNER1)}</b><br>
  ${esc([p.SITE_NUM,p.SITE_ST].filter(Boolean).join(' '))||'(no site address)'}<br>
  <span class="small">${esc(p.group.name)} — ${esc(p.group.ev)}</span><br>
  <span class="small">${srcLinks(p.group)}${p.PARCELID?` · <a href="https://www.pcpao.gov/property-details?s=${esc(p.PARCELID)}" target="_blank" rel="noopener">Parcel record</a>`:''}</span>
  ${tipHtml(tipsFor(p.PARCELID,null))}
  <div class="pbtns"><button onclick="window.open('${tipUrl([p.SITE_NUM,p.SITE_ST].filter(Boolean).join(' ')||p.OWNER1, (p.PARCELID||'')+' ('+p.bounds.getCenter().lat.toFixed(5)+','+p.bounds.getCenter().lng.toFixed(5)+')')}','_blank')">✍️ Add info / correction</button></div>`;
}

/* ================= BUSINESSES (live, OSM) ================= */
function pip(lat,lng,ring){let ins=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const [yi,xi]=ring[i],[yj,xj]=ring[j];if(((yi>lat)!=(yj>lat))&&(lng<(xj-xi)*(lat-yi)/(yj-yi)+xi))ins=!ins}return ins}
function parcelAt(lat,lng){for(const p of PARCELS){if(!p.bounds||!p.bounds.contains([lat,lng]))continue;if(p.rings.some(r=>pip(lat,lng,r)))return p}return null}
async function loadBiz(b){
  say('Loading businesses from OpenStreetMap…');
  const bb=`(${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()})`;
  const k=['shop','amenity','office','craft','tourism','leisure','healthcare'];
  const q=`[out:json][timeout:40];(${k.map(t=>`nwr["name"]["${t}"]${bb};`).join('')});out center tags;`;
  let j;
  try{j=await op(q)}catch(e){
    if(BIZ.length)throw e;
    j={elements:FALLBACK_BIZ.map(([n,k,a,lat,lon],i)=>({type:'f',id:i,lat,lon,tags:{name:n,shop:k.replace(/ /g,'_'),'addr:street':a}}))};
    window._offline=true;
  }
  const skip=/^(amenity:(parking|bench|waste_basket|bicycle_parking|parking_entrance|toilets|drinking_water|post_box|vending_machine|charging_station|atm|shelter|fountain|place_of_worship|school|police|fire_station|courthouse|grave_yard)|tourism:(artwork|information|viewpoint)|leisure:(park|pitch|garden|playground|picnic_table|marina|slipway|track|nature_reserve))$/;
  const seen=new Set(BIZ.map(x=>x.id));
  for(const e of j.elements){
    const t=e.tags,lat=e.lat??e.center?.lat,lng=e.lon??e.center?.lon; if(lat==null)continue;
    const kind=k.map(x=>t[x]?x+':'+t[x]:null).find(Boolean)||'';
    if(skip.test(kind)||seen.has(e.type+e.id))continue;
    const p=parcelAt(lat,lng);
    BIZ.push({id:e.type+e.id,name:t.name,kind:kind.split(':')[1].replace(/_/g,' '),cat:kind.split(':')[0],lat,lng,
      addr:[t['addr:housenumber'],t['addr:street']].filter(Boolean).join(' '),tier:p?p.tier:'N',parcel:p});
  }
  drawBiz(); return BIZ.length;
}
function effTier(b){const n=NOTES[b.id];if(n==='avoid')return b.tier==='N'?'C':b.tier;if(b.tier==='C'&&!SHOWC)return 'U';return b.tier}
function drawBiz(){
  bizLayer.clearLayers();
  for(const b of BIZ){
    const t=effTier(b);const n=NOTES[b.id];
    const m=L.circleMarker([b.lat,b.lng],{radius:7,color:'#fff',weight:2,fillColor:TIERC[t],fillOpacity:1});
    m.bindPopup(()=>bizPopup(b)); m.addTo(bizLayer); b.m=m;
    if(n==='ok') m.setStyle({color:'#1b5e20',weight:3});
  }
  renderPane();
}
function bizPopup(b){
  const p=b.parcel,n=NOTES[b.id];
  return `<b>${esc(b.name)}</b> <span class="small">${esc(b.kind)}</span><br>${esc(b.addr)}<br>
  ${p&&p.tier==='C'&&!SHOWC?`<span class="tag" style="background:${TIERC.U}">?</span>Unverified ownership lead. Turn on <i>unverified leads</i> in Key &amp; data for details.`:p?`<span class="tag" style="background:${TIERC[p.tier]}">${p.tier}</span>Landlord: <b>${esc(p.OWNER1)}</b><br><span class="small">${esc(p.group.name)}</span>`:`<span class="tag" style="background:${TIERC.N}">✓</span>No ownership link found <span class="small">(not proof of independence)</span>`}
  ${tipHtml(tipsFor(b.parcel?.PARCELID,[b.lat,b.lng]))}
  ${n?`<br><span class="small">Your note: <b>${n==='ok'?'checked — OK':'avoid'}</b></span>`:''}
  <div class="pbtns"><button onclick="routeToBiz('${b.id}')">🚶 Route here</button>
  <button onclick="window.open('${tipUrl(b.name+(b.addr?', '+b.addr:''),(b.parcel&&b.parcel.PARCELID?b.parcel.PARCELID+' ':'')+'('+b.lat.toFixed(5)+','+b.lng.toFixed(5)+')')}','_blank')">✍️ Add info</button>
  <button onclick="note('${b.id}','ok')">Mark OK</button><button onclick="note('${b.id}','avoid')">Mark avoid</button>${n?`<button onclick="note('${b.id}',null)">Clear note</button>`:''}</div>`;
}
window.note=(id,v)=>{if(v)NOTES[id]=v;else delete NOTES[id];store.set('cp_notes',NOTES);map.closePopup();drawBiz()};

/* ================= LOCATION ================= */
document.getElementById('locBtn').onclick=()=>{
  if(!navigator.geolocation){say('Location not available on this device');return}

};

/* ================= ROUTING (client-side, avoids flagged frontage) ================= */
const R=6371000,rad=Math.PI/180;
function dist(a,b){const x=(b[1]-a[1])*rad*Math.cos((a[0]+b[0])/2*rad),y=(b[0]-a[0])*rad;return Math.hypot(x,y)*R}
function segPtDist(p,a,b){ // meters, local equirectangular
  const cx=Math.cos(p[0]*rad)*rad*R,cy=rad*R;
  const ax=(a[1]-p[1])*cx,ay=(a[0]-p[0])*cy,bx=(b[1]-p[1])*cx,by=(b[0]-p[0])*cy;
  const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;let t=l2?-(ax*dx+ay*dy)/l2:0;t=Math.max(0,Math.min(1,t));
  return Math.hypot(ax+t*dx,ay+t*dy);
}
function nearFlagged(pt,m=14){
  for(const p of PARCELS){
    const b=p.bounds;if(!b||(p.tier==='C'&&!SHOWC))continue;
    if(pt[0]<b.getSouth()-.0002||pt[0]>b.getNorth()+.0002||pt[1]<b.getWest()-.0002||pt[1]>b.getEast()+.0002)continue;
    for(const r of p.rings)for(let i=0;i<r.length;i++){if(segPtDist(pt,r[i],r[(i+1)%r.length])<m)return p}
  }return null;
}
let GRAPH=null,GRAPHB=null;
async function loadGraph(b){
  say('Loading walkable streets…');
  const bb=`(${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()})`;
  const q=`[out:json][timeout:60];way["highway"]["highway"!~"motorway|motorway_link|trunk_link|construction|proposed|raceway|bus_guideway"]["foot"!="no"]["access"!~"private|no"]${bb};out geom;`;
  const j=await op(q);
  const nodes=new Map(),adj=new Map();
  const add=(a,b,w,len,fl)=>{if(!adj.has(a))adj.set(a,[]);adj.get(a).push({to:b,len,fl})};
  for(const w of j.elements){
    if(!w.nodes||!w.geometry)continue;
    for(let i=0;i<w.nodes.length;i++)nodes.set(w.nodes[i],[w.geometry[i].lat,w.geometry[i].lon]);
    for(let i=1;i<w.nodes.length;i++){
      const a=w.nodes[i-1],c=w.nodes[i],pa=nodes.get(a),pc=nodes.get(c);const len=dist(pa,pc);
      const mid=[(pa[0]+pc[0])/2,(pa[1]+pc[1])/2];const fl=!!nearFlagged(mid);
      add(a,c,0,len,fl);add(c,a,0,len,fl);
    }
  }
  GRAPH={nodes,adj};GRAPHB=b;say('Streets ready');
}
function nearestNode(pt){let best=null,bd=1e9;for(const [id,p] of GRAPH.nodes){if(!GRAPH.adj.has(id))continue;const d=dist(pt,p);if(d<bd){bd=d;best=id}}return best}
function dijkstra(s,t,penalty){
  const D=new Map([[s,0]]),P=new Map(),done=new Set();const h=[[0,s]];
  const push=(x)=>{h.push(x);let i=h.length-1;while(i>0){const p=(i-1)>>1;if(h[p][0]<=h[i][0])break;[h[p],h[i]]=[h[i],h[p]];i=p}};
  const pop=()=>{const top=h[0],last=h.pop();if(h.length){h[0]=last;let i=0;for(;;){const l=2*i+1,r=l+1;let m=i;if(l<h.length&&h[l][0]<h[m][0])m=l;if(r<h.length&&h[r][0]<h[m][0])m=r;if(m===i)break;[h[m],h[i]]=[h[i],h[m]];i=m}}return top};
  while(h.length){const [d,u]=pop();if(done.has(u))continue;done.add(u);if(u===t)break;
    for(const e of GRAPH.adj.get(u)||[]){const nd=d+e.len*(e.fl?penalty:1);if(nd<(D.get(e.to)??Infinity)){D.set(e.to,nd);P.set(e.to,u);push([nd,e.to])}}}
  if(!D.has(t))return null;const path=[t];while(path[0]!==s)path.unshift(P.get(path[0]));return path;
}
function pathStats(path){let len=0,fl=0;for(let i=1;i<path.length;i++){const e=GRAPH.adj.get(path[i-1]).find(x=>x.to===path[i]);len+=e.len;if(e.fl)fl+=e.len}return{len,fl}}
async function runRoute(){
  if(!routeFrom||!routeTo){renderPane();return}
  const b=L.latLngBounds([routeFrom,routeTo]).pad(0.6);
  try{
    if(!GRAPH||!GRAPHB.contains(b))await loadGraph(b);
    const s=nearestNode(routeFrom),t=nearestNode(routeTo);
    const avoid=document.getElementById('avoidChk')?.checked??true;
    const p=dijkstra(s,t,avoid?6:1),q=dijkstra(s,t,1);
    routeLayer.clearLayers();
    if(!p){say('No walking route found');return}
    const sp=pathStats(p),sq=pathStats(q);
    if(avoid&&q&&sq.len<sp.len-20)L.polyline(q.map(n=>GRAPH.nodes.get(n)),{color:'#777',weight:4,dashArray:'6 8',opacity:.7}).addTo(routeLayer).bindPopup(`Shortest: ${Math.round(sq.len)} m, ${Math.round(sq.fl)} m past flagged property`);
    L.polyline(p.map(n=>GRAPH.nodes.get(n)),{color:'#1565c0',weight:6,opacity:.85}).addTo(routeLayer);
    L.circleMarker(routeFrom,{radius:7,color:'#fff',weight:2,fillColor:'#1565c0',fillOpacity:1}).addTo(routeLayer);
    L.circleMarker(routeTo,{radius:7,color:'#fff',weight:2,fillColor:'#111',fillOpacity:1}).addTo(routeLayer);
    window._rs={sp,sq,avoid};say('Route ready');renderPane();
  }catch(e){say('Routing unavailable right now ('+e.message+') — street data servers did not answer. Try again in a minute.')}
}
window.routeToBiz=id=>{const b=BIZ.find(x=>x.id===id);routeTo=[b.lat,b.lng];routeTo.label=b.name;if(!routeFrom&&me){routeFrom=me.slice();routeFrom.label='My location'}map.closePopup();setTab('route');runRoute()};
let pickMode=null;
map.on('click',e=>{if(!pickMode)return;const pt=[e.latlng.lat,e.latlng.lng];pt.label='Map point';if(pickMode==='from')routeFrom=pt;else routeTo=pt;pickMode=null;runRoute();renderPane()});

/* ================= PANES ================= */
let TAB='near';
function setTab(t){TAB=t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));renderPane()}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
function renderPane(){
  const el=document.getElementById('pane');
  if(TAB==='near'){
    const center=me||[map.getCenter().lat,map.getCenter().lng];
    const cats=[...new Set(BIZ.map(b=>b.kind))].sort();
    const cat=window._cat||'';const show=window._show||'clean';
    let list=BIZ.filter(b=>(!cat||b.kind===cat)&&(show==='all'||(show==='clean'?effTier(b)==='N':effTier(b)!=='N')));
    list=list.map(b=>({b,d:dist(center,[b.lat,b.lng])})).sort((x,y)=>x.d-y.d).slice(0,60);
    el.innerHTML=`<div class="ctl"><select onchange="window._show=this.value;renderPane()"><option value="clean"${show==='clean'?' selected':''}>No link found</option><option value="flag"${show==='flag'?' selected':''}>Flagged landlord</option><option value="all"${show==='all'?' selected':''}>All</option></select>
    <select onchange="window._cat=this.value;renderPane()"><option value="">Any type</option>${cats.map(c=>`<option${c===cat?' selected':''}>${esc(c)}</option>`).join('')}</select>
    <span class="small">${me?'Nearest to you':'Nearest to map center'}</span></div>
    ${BIZ.length?'':'<div class="small">No businesses loaded yet — tap <b>Scan area</b>.</div>'}
    ${list.map(({b,d})=>`<div class="row" onclick="focusBiz('${b.id}')"><span class="dot" style="background:${TIERC[effTier(b)]}"></span><div><b>${esc(b.name)}</b> <span class="small">${esc(b.kind)}</span><br><span class="small">${Math.round(d)} m · ${esc(b.addr||'')}${b.parcel?' · landlord '+esc(b.parcel.OWNER1):''}${NOTES[b.id]?' · your note: '+NOTES[b.id]:''}</span></div></div>`).join('')}`;
  } else if(TAB==='route'){
    const rs=window._rs;
    el.innerHTML=`<div class="ctl"><button class="btn" onclick="useMe()">From: ${routeFrom?esc(routeFrom.label||'set'):'my location'}</button><button class="btn" onclick="pickMode='from';say('Tap the map for the start')">Pick start</button></div>
    <div class="ctl"><button class="btn" onclick="pickMode='to';say('Tap the map for the destination')">To: ${routeTo?esc(routeTo.label||'set'):'tap to pick'}</button>
    <label class="small"><input type="checkbox" id="avoidChk" ${!rs||rs.avoid?'checked':''} onchange="runRoute()"> Avoid walking past flagged property</label></div>
    ${rs?`<div class="row" style="cursor:default"><span class="dot" style="background:#1565c0"></span><div><b>${Math.round(rs.sp.len)} m</b> · about ${Math.max(1,Math.round(rs.sp.len/80))} min walk (at ~80 m/min)<br><span class="small">${Math.round(rs.sp.fl)} m alongside flagged parcels${rs.avoid&&rs.sq.len<rs.sp.len-20?` · shortest route (dashed) is ${Math.round(rs.sq.len)} m with ${Math.round(rs.sq.fl)} m alongside flagged parcels`:''}</span></div></div>`:'<div class="small">Pick a start and destination, or tap a business and choose <b>Route here</b>. Walking past a building costs nothing — this option is for when you would rather not.</div>'}
    <button class="btn" onclick="routeFrom=routeTo=null;window._rs=null;routeLayer.clearLayers();renderPane()">Clear route</button>`;
  } else {
    const cnt=t=>PARCELS.filter(p=>p.tier===t).length;
    el.innerHTML=`<div class="legend"><span><span class="dot" style="background:${TIERC.A}"></span>A Church-owned (${cnt('A')})</span><span><span class="dot" style="background:${TIERC.B}"></span>B Reported link (${cnt('B')})</span><span><span class="dot" style="background:${TIERC.C}"></span>C Probable — verify (${cnt('C')})</span><span><span class="dot" style="background:${TIERC.N}"></span>No link found</span><span><span class="dot" style="background:${TIERC.U}"></span>Unverified lead (hidden)</span></div>
    <label class="small" style="display:block;margin:4px 0 8px"><input type="checkbox" ${SHOWC?'checked':''} onchange="toggleC(this.checked)"> Show unverified leads (yellow). These rest on a shared address or manager only and may be wrong.</label>
    <div class="warn"><b>Green dots are not recommendations.</b> They are every named business volunteers have added to OpenStreetMap in this area whose building has no ownership link in these sources. Many real storefronts are missing from OpenStreetMap, so the green set looks patchy. It is not proof of independence either. Your OK/avoid notes stay on this device only.</div>
    <p class="small">Ownership comes <b>live</b> from the Pinellas County Property Appraiser each time the app opens, so sales and ownership changes show up automatically. An LLC that starts using a known group's mailing address is flagged as "possible new member" in yellow.</p>
    <div class="warn" style="background:#f3e5f5;border-color:#ce93d8"><b>Public comments</b> (${TIPS.length}) <label class="small" style="float:right"><input type="checkbox" ${SHOWTIPS?'checked':''} onchange="toggleTips(this.checked)"> Show</label><br><span class="small">Posted by anyone and shown <b>immediately, without review</b>. They may be wrong. Purple dots and the "Public comments" part of popups.</span><br><span class="small">Know something? Tap a property or business and choose <b>✍️ Add info</b>, or <a href="https://github.com/${REPO}/issues/new?template=ownership-tip.yml" target="_blank" rel="noopener">post a comment</a> (free GitHub account needed) · <a href="https://github.com/${REPO}/issues?q=is%3Aopen+label%3Atip" target="_blank" rel="noopener">read all</a></span></div>
    <p class="small"><b>Groups and evidence</b></p>
    ${GROUPS.map(g=>`<div class="row" style="cursor:default"><span class="dot" style="background:${TIERC[g.tier]}"></span><div><b>${esc(g.name)}</b> <span class="small">(${PARCELS.filter(p=>p.group.name===g.name).length} parcels)</span><br><span class="small">${esc(g.ev)} ${srcLinks(g)}</span></div></div>`).join('')}
    <p class="small">Map © OpenStreetMap contributors (ODbL). Parcels © Pinellas County Property Appraiser — not a title search.</p>`;
  }
}
window.renderPane=renderPane;window.runRoute=runRoute;
window.useMe=()=>{if(!me){document.getElementById('locBtn').click();return}routeFrom=me.slice();routeFrom.label='My location';runRoute();renderPane()};
window.focusBiz=id=>{const b=BIZ.find(x=>x.id===id);map.setView([b.lat,b.lng],18,{animate:false});map.panBy([0,Math.round(document.getElementById('sheet').offsetHeight/2)],{animate:false});b.m.openPopup()};
map.on('moveend',()=>{if(TAB==='near'&&!me)renderPane()});
