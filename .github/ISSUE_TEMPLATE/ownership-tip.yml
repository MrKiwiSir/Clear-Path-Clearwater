name: Comment on a building or business
description: Share what you know about who owns or runs a building or business in downtown Clearwater. Appears on the map right away.
title: "[Tip] "
labels: ["tip"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping! Your comment is **public and appears on the Clear Path map right away**. Anyone can read it and reply.

        Word of mouth is welcome. Just say how you know. Please keep it about buildings and businesses, and leave out private details like someone's home address or phone number.
  - type: input
    id: place
    attributes:
      label: Building or business
      description: Name and street address
      placeholder: "e.g. Example Cafe, 500 Cleveland St"
    validations:
      required: true
  - type: input
    id: parcel
    attributes:
      label: Parcel ID or map location
      description: Filled in automatically if you came from the map. Otherwise leave blank or paste the Pinellas parcel ID.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of tip is this?
      options:
        - Ownership link the map is missing
        - The map's information is wrong or outdated
        - Property was sold / owner changed
        - Business opened, closed or moved
        - Other
    validations:
      required: true
  - type: textarea
    id: info
    attributes:
      label: What do you know?
      description: Who owns or runs it, how it's connected, what changed. Be as specific as you can.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source (optional)
      description: How do you know? A link, a document, "the owner told me", "I worked there", or "heard it around town" are all fine.
  - type: checkboxes
    id: rules
    attributes:
      label: Confirm
      options:
        - label: I left out private personal details (home addresses, phone numbers and the like).
          required: true
