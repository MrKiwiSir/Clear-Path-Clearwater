name: Set up tip labels
on:
  push:
    paths: [".github/workflows/labels.yml"]
  workflow_dispatch:
permissions:
  issues: write
jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh label create tip         --repo "$REPO" --color "1d76db" --description "New ownership tip from the public" --force
          gh label create hidden      --repo "$REPO" --color "b60205" --description "Removed from the map (spam, private details, or off-topic)" --force
